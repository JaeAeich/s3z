[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = ["ruff>=0.11"]

[project]
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "scalar-fastapi>=1.0",
  "uvicorn[standard]>=0.34",
]
description = "FastAPI server using s3z Python bindings"
name = "s3z-fastapi-example"
requires-python = ">=3.11"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "COM812", # trailing comma (conflicts with formatter)
  "D",      # pydocstyle — not needed for examples
  "ISC001", # implicit string concat (conflicts with formatter)
  "T201",   # print() — this is a server example
]
select = ["ALL"]

[tool.ty.environment]
extra-paths = ["../../bindings/python"]
python-version = "3.14"
