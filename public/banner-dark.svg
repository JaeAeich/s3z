<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;1,800&amp;display=swap');
    </style>
  </defs>
  <rect width="1600" height="400" fill="#1a1614"/>
  <!-- Speed lines -->
  <g transform="rotate(-18 400 200)" opacity="0.04">
    <line x1="0" y1="-200" x2="0" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
    <line x1="98" y1="-200" x2="98" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
    <line x1="196" y1="-200" x2="196" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
    <line x1="294" y1="-200" x2="294" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
    <line x1="392" y1="-200" x2="392" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
    <line x1="490" y1="-200" x2="490" y2="800" stroke="#f3ede1" stroke-width="1.5"/>
  </g>
  <!-- Right rust accent bars -->
  <rect x="1594" y="0" width="6" height="400" fill="#c8512a"/>
  <rect x="1574" y="0" width="2" height="400" fill="#c8512a" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="80" y="240" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="220" font-weight="800" font-style="italic" letter-spacing="-11">
    <tspan fill="#f3ede1">s</tspan><tspan fill="#c8512a">3</tspan><tspan fill="#f3ede1">z</tspan>
  </text>
  <!-- Tagline -->
  <text x="80" y="290" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="500" font-style="italic" fill="#f3ede1" opacity="0.7" letter-spacing="0.5">// s3 ops. fearlessly fast.</text>
  <!-- Label -->
  <text x="80" y="330" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#f3ede1" opacity="0.6" letter-spacing="2.6" text-transform="uppercase">
    <tspan fill="#c8512a">&#x25B8;</tspan> S3 OPS &#x2014; IN RUST
  </text>
</svg>
