<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;1,800&amp;display=swap');
    </style>
  </defs>
  <rect width="1600" height="400" fill="#f3ede1"/>
  <!-- Speed lines -->
  <g transform="rotate(-18 400 200)" opacity="0.05">
    <line x1="0" y1="-200" x2="0" y2="800" stroke="#1a1614" stroke-width="1.5"/>
    <line x1="98" y1="-200" x2="98" y2="800" stroke="#1a1614" stroke-width="0.6"/>
    <line x1="196" y1="-200" x2="196" y2="800" stroke="#1a1614" stroke-width="1.5"/>
    <line x1="294" y1="-200" x2="294" y2="800" stroke="#1a1614" stroke-width="0.6"/>
    <line x1="392" y1="-200" x2="392" y2="800" stroke="#1a1614" stroke-width="1.5"/>
    <line x1="490" y1="-200" x2="490" y2="800" stroke="#1a1614" stroke-width="0.6"/>
    <line x1="588" y1="-200" x2="588" y2="800" stroke="#1a1614" stroke-width="1.5"/>
    <line x1="686" y1="-200" x2="686" y2="800" stroke="#1a1614" stroke-width="0.6"/>
  </g>
  <!-- Angled rust bar at bottom -->
  <rect x="-40" y="380" width="1700" height="16" fill="#c8512a" transform="rotate(-2 0 388)"/>
  <!-- Wordmark -->
  <text x="80" y="240" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="220" font-weight="800" font-style="italic" letter-spacing="-11">
    <tspan fill="#1a1614">s</tspan><tspan fill="#c8512a">3</tspan><tspan fill="#1a1614">z</tspan>
  </text>
  <!-- Tagline -->
  <text x="80" y="290" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="500" font-style="italic" fill="#2a2421" letter-spacing="0.5">// s3 ops. fearlessly fast.</text>
  <!-- Stat block -->
  <rect x="1280" y="120" width="240" height="160" fill="#1a1614"/>
  <rect x="1288" y="128" width="240" height="160" fill="#c8512a" opacity="0.6"/>
  <rect x="1280" y="120" width="240" height="160" fill="#1a1614"/>
  <text x="1304" y="152" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.6" fill="rgba(243,237,225,0.55)">BUILT IN</text>
  <text x="1304" y="205" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="40" font-weight="800" font-style="italic" letter-spacing="-1" fill="#f3ede1">rust</text>
  <text x="1430" y="205" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="40" font-weight="800" font-style="italic" fill="#c8512a"> &#xBB;</text>
  <text x="1304" y="232" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="rgba(243,237,225,0.6)" letter-spacing="0.5">// memory-safe. zero gc.</text>
  <text x="1304" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="rgba(243,237,225,0.6)" letter-spacing="0.5">// no fear.</text>
  <!-- Rust shadow offset for stat block -->
  <rect x="1288" y="128" width="240" height="160" fill="#c8512a" rx="0"/>
  <rect x="1280" y="120" width="240" height="160" fill="#1a1614" rx="0"/>
  <text x="1304" y="152" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.6" fill="#f3ede1" opacity="0.55">BUILT IN</text>
  <text x="1304" y="205" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="40" font-weight="800" font-style="italic" letter-spacing="-1" fill="#f3ede1">rust <tspan fill="#c8512a">&#xBB;</tspan></text>
  <text x="1304" y="232" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#f3ede1" opacity="0.6" letter-spacing="0.5">// memory-safe. zero gc.</text>
  <text x="1304" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" fill="#f3ede1" opacity="0.6" letter-spacing="0.5">// no fear.</text>
</svg>
