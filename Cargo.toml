[dependencies]
aws-credential-types = { features = ["hardcoded-credentials"], version = "1" }
aws-sigv4 = { features = ["sign-http"], version = "1" }
bytes = "1"
http = "1"
percent-encoding = "2"
quick-xml = { features = ["serialize"], version = "0.37" }
reqwest = { default-features = false, features = [
  "rustls-tls",
  "stream",
], version = "0.12" }
serde = { features = ["derive"], version = "1" }
thiserror = "2"
tokio = { features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "sync",
], version = "1" }
walkdir = "2"

[lints.clippy]
all = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
cargo = { level = "deny", priority = -1 }
implicit_return = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
mod_module_files = "allow"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
pub_with_shorthand = "allow"
question_mark_used = "allow"
restriction = { level = "warn", priority = -1 }
self_named_module_files = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"

[lints.rust]
elided_lifetimes_in_paths = "deny"
keyword_idents = { level = "forbid", priority = -1 }
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "forbid"
rust_2024_compatibility = { level = "deny", priority = -1 }
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[package]
categories = ["asynchronous", "network-programming", "web-programming"]
description = "S3 ops, but fearlessly fast!"
edition = "2024"
keywords = ["aws", "cloud", "multithread", "s3", "storage"]
license = "MIT"
name = "s3z"
readme = "README.md"
repository = "github.com/jaeaeich/s3z"
version = "0.1.0"
