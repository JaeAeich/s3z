[dist]
cargo-dist-version = "0.31.0"
ci = "github"
hosting = "github"
install-path = "CARGO_HOME"
installers = ["npm", "powershell", "shell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]

[workspace]
members = ["cargo:crates/cli"]
