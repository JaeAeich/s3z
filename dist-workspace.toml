[dist]
# release.yml is kept up to date by dependabot; re-run `dist init` after upgrading dist.
allow-dirty = ["ci"]
cargo-dist-version = "0.31.0"
ci = "github"
hosting = "github"
install-path = "CARGO_HOME"
installers = ["npm", "shell"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
]

[workspace]
members = ["cargo:crates/cli"]
