name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `s3z download -b my-bucket -p prefix/ -d ./out`
        2. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or logs if available.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of s3z is affected?
      options:
        - Core library (crates/core)
        - CLI (crates/cli)
        - Node.js bindings (crates/node)
        - Python bindings (crates/python)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: s3z version
      description: Output of `s3z --version` or the crate/package version.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: S3 backend
      description: Which S3-compatible backend are you using?
      options:
        - AWS S3
        - MinIO
        - Cloudflare R2
        - Garage
        - SeaweedFS
        - Other

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "macOS 15.4 arm64 / Ubuntu 24.04 x86_64"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — config, logs, screenshots.
